<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
{{ if or .Site.Params.noIndex .Site.Params.preview }}
<meta name="robots" content="noindex, nofollow">
{{ end }}
<link rel="canonical" href="{{ .Permalink }}">
{{ range .AllTranslations }}
<link rel="alternate" hreflang="{{ .Language.Locale | default .Language.Lang }}" href="{{ .Permalink }}">
{{ end }}
{{ with .Site.Home }}
<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">
{{ end }}
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<meta name="theme-color" content="#2F5D50">
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "img/vladyslav-petrenko-square.jpg" | absURL }}">
<meta property="og:locale" content="{{ if eq .Site.Language.Lang "en" }}en_GB{{ else }}de_DE{{ end }}">
<meta name="twitter:card" content="summary">
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
{{ if .IsHome }}{{ partial "schema.html" . }}{{ end }}
